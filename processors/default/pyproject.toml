[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-processor"
version = "0.1.0"
description = "Knowledge Builder reference processor — OCR + LLM pipeline for Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # docling is the single library that handles PDF, DOCX, XLSX, and PPTX
    # conversion to Markdown with consistent structural preservation.
    # It replaces the prior python-docx / openpyxl / python-pptx trio.
    "docling>=2.0.0",
    # Image handling for saving extracted pictures (PIL is used by docling
    # internally but we also call it directly when converting images to bytes).
    "Pillow>=10.0.0",
    # Pydantic v2 for the processor I/O contract models (models.py).
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Install the vision extra to enable LLM-based image description (T37).
# Usage: pip install -e "processors/default[vision]"
vision = [
    "openai>=1.30.0",
]

[project.scripts]
kb-processor = "kb_processor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kb_processor"]
