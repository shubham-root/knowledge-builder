[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-processor"
version = "0.1.0"
description = "Knowledge Builder reference processor — OCR + LLM pipeline for Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # docling is the single library that handles PDF, DOCX, XLSX, and PPTX
    # conversion to Markdown with consistent structural preservation.
    # It replaces the prior python-docx / openpyxl / python-pptx trio.
    "docling>=2.0.0",
    # Image handling for saving extracted pictures (PIL is used by docling
    # internally but we also call it directly when converting images to bytes).
    "Pillow>=10.0.0",
    # Pydantic v2 for the processor I/O contract models (models.py).
    "pydantic>=2.0.0",
    # ------------------------------------------------------------------ #
    # MPS × transformers regression pin                                  #
    # ------------------------------------------------------------------ #
    # transformers 5.9.0 hard-codes ``torch.arange(..., dtype=torch.float64,
    # device=device)`` inside ``rt_detr_v2.modeling_rt_detr_v2.
    # build_2d_sinusoidal_position_embedding``.  Apple's MPS backend does
    # not support ``float64`` and crashes every page of every PDF with
    #   TypeError: Cannot convert a MPS Tensor to float64 dtype
    # Setting ``DOCLING_DEVICE=cpu`` does NOT work around it (the layout
    # model still ends up on MPS via docling internals).
    #
    # transformers 5.8.x runs fine on MPS at full GPU speed.  Pin until
    # docling PR #2721 (proper float16 MPS support) ships and we have a
    # docling release built against a fixed transformers.
    #
    # Tracking: https://github.com/docling-project/docling/issues/3483
    "transformers>=5.8.1,<5.9.0",
]

[project.optional-dependencies]
# Install the vision extra to enable LLM-based image description (T37)
# AND the OpenAI-backed LLM synthesis pipeline.
# Usage: pip install -e "processors/default[vision]"
vision = [
    "openai>=1.30.0",
]

# Install the llm extra for litellm support (handles OpenAI, Anthropic,
# AWS Bedrock, and many other providers through a single interface).
# Usage: pip install -e "processors/default[llm]"
llm = [
    "litellm>=1.0.0",
]

# Install the anthropic extra for direct Anthropic / Claude support.
# Also works via litellm when the [llm] extra is installed.
# Usage: pip install -e "processors/default[anthropic]"
anthropic = [
    "anthropic>=0.25.0",
]

# Install everything at once for full functionality.
# Usage: pip install -e "processors/default[all]"
all = [
    "openai>=1.30.0",
    "litellm>=1.0.0",
    "anthropic>=0.25.0",
]

[project.scripts]
kb-processor = "kb_processor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kb_processor"]
