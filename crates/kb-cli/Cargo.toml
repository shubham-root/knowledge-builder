[package]
name        = "kb-cli"
version     = "0.1.0"
edition     = "2021"
description = "The `kb` binary: daemon entrypoint and all operational subcommands"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
kb-core    = { workspace = true }
kb-watcher = { workspace = true }
kb-worker  = { workspace = true }
kb-ops     = { workspace = true }

# CLI argument parsing
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Platform helpers (config path)
dirs = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Time formatting
chrono = { workspace = true }

# Glob pattern matching (used for building ignore-glob sets at daemon startup)
globset = { workspace = true }

# Logging
tracing = { workspace = true }

# Terminal colors
colored = { workspace = true }

# SQLite (direct use in backup.rs for VACUUM INTO / integrity_check)
rusqlite = { workspace = true }

# UID lookup (install/uninstall)
libc = { workspace = true }

# HTTP client (daemon fallback when daemon is running)
reqwest      = { workspace = true }

# Async stream utilities (SSE tail stream)
futures-util = { workspace = true }
