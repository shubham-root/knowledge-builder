[package]
name        = "kb-core"
version     = "0.1.0"
edition     = "2021"
description = "Foundation crate: types, config, SQLite state store, path utilities, tracing setup"

[dependencies]
# Async runtime
tokio            = { workspace = true }

# Serialization
serde            = { workspace = true }
serde_json       = { workspace = true }

# Error handling
thiserror        = { workspace = true }
anyhow           = { workspace = true }

# Logging / tracing
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# SQLite – statically linked via 'bundled'
rusqlite         = { workspace = true }

# Configuration (TOML + env-var overrides)
figment          = { workspace = true }

# Hashing utilities (re-exported for downstream)
sha2             = { workspace = true }
digest           = { workspace = true }

# Platform helpers
dirs             = { workspace = true }
chrono           = { workspace = true }
fs2              = { workspace = true }
libc             = { workspace = true }

[dev-dependencies]
tempfile         = { workspace = true }
proptest         = { workspace = true }
toml             = "0.9"
